<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<title>语言学习工作台 · 英日韩</title>
<meta name="description" content="英语 / 日语 / 韩语三语学习工作台，自动保存，按日期归档，间隔重复复习">
<meta name="theme-color" content="#f6f7f9">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="语言学习工作台">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="css/styles.css?v=20260814a">
</head>
<body>

<!-- 图标精灵 -->
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-capture" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/>
  </symbol>
  <symbol id="i-review" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 12a9 9 0 019-9 9.75 9.75 0 016.74 2.74L21 8"/><path d="M21 3v5h-5"/>
    <path d="M21 12a9 9 0 01-9 9 9.75 9.75 0 01-6.74-2.74L3 16"/><path d="M8 16H3v5"/>
  </symbol>
  <symbol id="i-history" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
  </symbol>
  <symbol id="i-stats" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 3v18h18"/><path d="M7 15l3-4 3 3 5-7"/>
  </symbol>
  <symbol id="i-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 18l6-6-6-6"/>
  </symbol>
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
  </symbol>
  <symbol id="i-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 4H4v16h16v-7"/><path d="M18.5 2.5a2.12 2.12 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
  </symbol>
  <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/>
  </symbol>
  <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <path d="M18 6L6 18M6 6l12 12"/>
  </symbol>
  <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
    <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
  </symbol>
  <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>
  </symbol>
  <symbol id="i-more" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <circle cx="12" cy="5" r="1.4" fill="currentColor" stroke="none"/>
    <circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/>
    <circle cx="12" cy="19" r="1.4" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"/>
    <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/>
  </symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 6L9 17l-5-5"/>
  </symbol>
  <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <path d="M12 5v14M5 12h14"/>
  </symbol>
  <symbol id="i-sync" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/>
  </symbol>
  <symbol id="i-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 13l5 5 5-5M7 6l5 5 5-5"/>
  </symbol>
  <symbol id="i-collapse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 11l5-5 5 5M7 18l5-5 5 5"/>
  </symbol>
  <symbol id="i-volume" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7"/><path d="M18.5 5.5a9 9 0 010 13"/>
  </symbol>
</svg>

<div class="app">

  <!-- ============ 侧边栏（桌面端） ============ -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">EN<br></div>
      <div>
        <div class="brand-name">语言工作台</div>
        <div class="brand-sub">英语 · 日语 · 韩语</div>
      </div>
    </div>

    <div class="nav-label">工作区</div>
    <button class="nav-item active" data-view="capture">
      <svg><use href="#i-capture"/></svg> 今日学习
    </button>
    <button class="nav-item" data-view="review">
      <svg><use href="#i-review"/></svg> 复习
      <span class="nav-badge hidden" id="navDue">0</span>
    </button>
    <button class="nav-item" data-view="history">
      <svg><use href="#i-history"/></svg> 历史归档
    </button>
    <button class="nav-item" data-view="stats">
      <svg><use href="#i-stats"/></svg> 学习统计
    </button>

    <div class="nav-label">数据</div>
    <button class="nav-item" id="btnExport">
      <svg><use href="#i-history"/></svg> 导出备份
    </button>
    <button class="nav-item" id="btnImport">
      <svg><use href="#i-plus"/></svg> 导入数据
    </button>
    <button class="nav-item" id="btnSyncCloud" title="立即把本机数据上传到云端并拉取其它端改动（双向同步）">
      <svg><use href="#i-sync"/></svg> 同步到云端
    </button>

    <div class="sidebar-foot">
      <div class="sync-chip">
        <span class="sync-dot" id="syncDot"></span>
        <span id="syncText">已自动保存</span>
      </div>
      <button class="nav-item" id="btnTheme">
        <svg><use href="#i-moon"/></svg> <span id="themeLabel">深色模式</span>
      </button>
    </div>
  </aside>

  <!-- ============ 主区域 ============ -->
  <main class="main" id="main">
    <header class="topbar">
      <h1 class="page-title" id="pageTitle">今日录入</h1>
      <span class="page-sub" id="pageSub"></span>

      <div class="topbar-right">
        <div class="lang-tabs" id="langTabs">
          <button class="lang-tab active" data-lang="all">全部</button>
          <button class="lang-tab" data-lang="en">英语</button>
          <button class="lang-tab" data-lang="ja">日语</button>
          <button class="lang-tab" data-lang="ko">韩语</button>
        </div>
        <button class="btn btn-icon btn-ghost" id="btnOpenSettings" title="学习设置">
          <svg><use href="#i-gear"/></svg>
        </button>
        <button class="btn btn-icon btn-ghost" id="btnThemeMobile" title="切换主题">
          <svg><use href="#i-moon"/></svg>
        </button>
        <button class="btn btn-icon btn-ghost" id="btnSyncCloudTop" title="立即把本机数据上传到云端并拉取其它端改动">
          <svg><use href="#i-sync"/></svg>
        </button>
      </div>
    </header>

    <div class="content" id="content"></div>
  </main>
</div>

<!-- ============ 移动端底部导航 ============ -->
<nav class="mobile-nav">
  <button class="mnav-item active" data-view="capture">
    <svg><use href="#i-capture"/></svg> 学习
  </button>
  <button class="mnav-item" data-view="review">
    <svg><use href="#i-review"/></svg> 复习
    <span class="mnav-badge hidden" id="mnavDue">0</span>
  </button>
  <button class="mnav-item" data-view="history">
    <svg><use href="#i-history"/></svg> 历史
  </button>
  <button class="mnav-item" data-view="stats">
    <svg><use href="#i-stats"/></svg> 统计
  </button>
</nav>

<div class="toast-wrap" id="toastWrap"></div>
<div id="modalRoot"></div>
<input type="file" id="fileInput" accept="application/json" style="display:none">

<script src="js/store.js?v=20260814e"></script>
<script src="js/themes.js"></script>
<script src="js/wb-en.js"></script>
<script src="js/wb-ja.js"></script>
<script src="js/wb-ko.js"></script>
<script src="js/ai.js?v=20260813e"></script>
<script src="js/app.js?v=20260814j"></script>
</body>
</html>
